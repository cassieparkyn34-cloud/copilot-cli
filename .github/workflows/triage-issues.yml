name: Label incoming issues
on:
  issues:
    types:
      - reopened
      - opened
      - unlabeled

permissions:
  issues: write

jobs:
  label_issues:
    runs-on: ubuntu-latest
    steps:
      - name: Add triage label on new or reopened issue
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        run: gh issue edit "$NUMBER" --add-label "$LABELS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: triage
      - name: Restore triage label when more-info-needed is removed
        if: github.event.action == 'unlabeled' && github.event.label.name == 'more-info-needed'
        run: gh issue edit "$NUMBER" --add-label "$LABELS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: triage
